trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

steps:
  - checkout: self

  # --------------------------
  # Cache Maven dependencies
  # --------------------------
  - task: Cache@2
    inputs:
      key: 'maven | "$(Agent.OS)" | experiment-02-maven/pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
      path: $(MAVEN_CACHE_FOLDER)
    displayName: 'Cache Maven dependencies'

  # --------------------------
  # Build & Test with Maven
  # --------------------------
  - task: Maven@4
    inputs:
      mavenPomFile: 'experiment-02-maven/pom.xml'
      goals: 'clean package'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.17'
    displayName: 'Maven Build & Test'

  # ✅ Debug step (very important)
  - script: ls -R experiment-02-maven/target
    displayName: 'Verify build output'

  # --------------------------
  # Deploy to Azure App Service
  # --------------------------
  - task: AzureWebApp@1
    inputs:
      azureSubscription: 'Azure subscription 1(e9a472da-79d4-4781-90da-445594c7bc6c)'
      appName: 'azure-poc'
      package: 'experiment-02-maven/target/*.jar'
    displayName: 'Deploy to Azure App Service'