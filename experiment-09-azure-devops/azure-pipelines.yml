trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

steps:
  # --------------------------
  # Cache Maven dependencies
  # --------------------------
  - task: Cache@2
    inputs:
      key: 'maven | "$(Agent.OS)" | pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
      path: $(MAVEN_CACHE_FOLDER)
    displayName: 'Cache Maven dependencies'

  # --------------------------
  # Build & Test with Maven
  # --------------------------
  - task: Maven@4
    inputs:
      mavenPomFile: 'experiment-02-maven/pom.xml'
      goals: 'clean package'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.17'
    displayName: 'Maven Build & Test'

  # --------------------------
  # Publish Artifacts
  # --------------------------
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'experiment-02-maven/target'
      ArtifactName: 'drop'
    displayName: 'Publish Artifacts'

  # --------------------------
  # Deploy to Azure App Service
  # --------------------------
  - task: AzureWebApp@1
    inputs:
      azureSubscription: 'Azure subscription 1(e9a472da-79d4-4781-90da-445594c7bc6c)'  # Your service connection
      appName: 'azure-poc'                                                               # Your App Service name
      package: 'experiment-02-maven/target/*.jar'                                        # Built JAR
      runtimeStack: 'JAVA|17-java17'                                                    # Java 17 runtime
      startupCommand: 'java -jar *.jar'                                                # Spring Boot startup
    displayName: 'Deploy to Azure App Service'